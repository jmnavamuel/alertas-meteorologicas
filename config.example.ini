[data]
# Modo de datos: 'dummy' para datos de prueba, 'real' para datos reales de AEMET
# - dummy: Usa data/alertas_dummy.csv para testing y desarrollo
# - real: Usa el CSV más reciente generado por el downloader de AEMET
mode=real

[scheduler]
# Intervalo de ejecución del downloader en minutos
# Por defecto: 60 (cada hora)
interval_minutes=60

[logging]
# Nivel de log: debug, info, warn, error
level=info

# INSTRUCCIONES DE USO:
# 1. Copia este archivo a config.ini
# 2. Personaliza los valores según tu entorno
# 3. Para cambiar de datos dummy a reales, solo cambia "mode=dummy" por "mode=real"
# 4. El archivo config.ini NO se sube a Git (está en .gitignore)
